<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surgalxy</title>
<link rel="icon" href="/favicon.png">
<meta name="description" content="Surgalxy. Worlds of awe, cosmic and mythic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Layout idea: one screen. A living colour sky fills the frame, a monolith
     stands on a mirror plain, the wordmark sits on the water bottom-left. */
  :root {
    color-scheme: dark;
    --deep: #1b0f5c;      /* sky zenith, set live by the script */
    --hot: #ff3d2e;       /* horizon colour */
    --flare: #ff9f1c;     /* aurora colour */
    --light: #fff1b8;     /* glow and highlights */
    --ink: #fbf6ff;       /* text */
    --ink-soft: rgba(251, 246, 255, 0.78);
    --display: "Syncopate", "Eurostile", "Arial Black", sans-serif;
    --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --gutter: clamp(18px, 4vw, 56px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--deep) 0%, var(--hot) 62%, var(--flare) 70%, #05030f 71%, #05030f 100%);
    color: var(--ink);
    font-family: var(--display);
    overflow: hidden;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .frame {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: var(--gutter);
    pointer-events: none;
  }
  .frame > * { pointer-events: auto; }

  /* Sky picker */
  .skies {
    align-self: flex-end;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 10px 8px 16px;
    border-radius: 999px;
    background: rgba(5, 3, 15, 0.34);
    border: 1px solid rgba(255, 255, 255, 0.16);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .skies__name {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
    min-width: 13ch;
  }
  .skies__list { display: flex; gap: 8px; }
  .swatch {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.25);
    padding: 0;
    cursor: pointer;
    transition: transform 0.25s ease, border-color 0.25s ease;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch[aria-pressed="true"] { border-color: #fff; transform: scale(1.15); }
  button:focus-visible, a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* Wordmark block */
  .mark { display: flex; flex-direction: column; gap: clamp(10px, 1.6vh, 20px); }
  h1 {
    margin: 0 0 0 -0.04em;
    font-weight: 700;
    font-size: min(8.4vw, 8.2rem);
    line-height: 0.9;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--ink);
    text-shadow: 0 0 40px color-mix(in srgb, var(--light) 55%, transparent), 0 2px 30px rgba(5, 3, 15, 0.45);
  }
  .line {
    margin: 0;
    font-family: var(--serif);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.25rem, 2.3vw, 2rem);
    line-height: 1.2;
    max-width: 30ch;
    text-wrap: balance;
    text-shadow: 0 1px 18px rgba(5, 3, 15, 0.7);
  }
  .contact {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
    margin-top: clamp(4px, 1vh, 12px);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .contact a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--light) 70%, transparent);
    padding-bottom: 3px;
    text-transform: none;
    letter-spacing: 0.12em;
  }
  .contact a:hover { border-bottom-color: #fff; }
  .copy {
    font: inherit;
    color: var(--ink);
    background: rgba(5, 3, 15, 0.34);
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .copy:hover { background: rgba(255, 255, 255, 0.16); }

  @media (max-width: 560px) {
    h1 { font-size: 9.8vw; }
    .skies { gap: 10px; padding-left: 12px; }
    .skies__name { min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .swatch, .copy { transition: none; }
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>

<main class="frame">
  <div class="skies" role="group" aria-label="Choose a sky">
    <span class="skies__name" id="skyName">Ember Tide</span>
    <div class="skies__list" id="skyList"></div>
  </div>

  <div class="mark">
    <h1>Surgalxy</h1>
    <p class="line">Worlds of awe, cosmic and mythic.</p>
    <div class="contact">
      <a href="mailto:surgalxy@gmail.com">surgalxy@gmail.com</a>
      <button class="copy" id="copyBtn" type="button">Copy email</button>
      <a href="https://www.instagram.com/surgalxy/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.tiktok.com/@surgalxy" target="_blank" rel="noopener">TikTok</a>
      <a href="https://youtube.com/@surgalxy" target="_blank" rel="noopener">YouTube</a>
      <a href="https://x.com/surgalxy" target="_blank" rel="noopener">X</a>
    </div>
  </div>
</main>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 R;
uniform float T;
uniform vec2 M;
uniform vec3 C0, C1, C2, C3;
#define HOR -0.2

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p) {
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 5; i++) {
    s += a * noise(p);
    p = p * 2.03 + vec2(17.1, 3.7);
    a *= 0.5;
  }
  return s;
}

vec3 scene(vec2 p) {
  float A = R.x / R.y;
  float h = clamp((p.y - HOR) / (0.5 - HOR), 0.0, 1.0);

  // sky: domain-warped colour currents
  vec2 q = p * vec2(1.1, 1.7) + M * 0.03;
  float t = T * 0.025;
  float w1 = fbm(q * 1.4 + vec2(t, -t * 0.6));
  float w2 = fbm(q * 2.2 + w1 * 2.4 + vec2(-t * 0.8, t * 0.3));
  float f = fbm(q * 1.1 + w2 * 2.0);
  vec3 col = mix(C1, C0, smoothstep(0.0, 0.95, h + (w1 - 0.5) * 0.4));
  float band = smoothstep(0.40, 0.74, f) * (1.0 - h * 0.5);
  col = mix(col, C2, band * 0.85);
  float hi = smoothstep(0.5, 0.85, w2) * smoothstep(0.35, 0.7, f);
  col += C3 * hi * 0.32;
  col += mix(C2, C3, 0.5) * exp(-h * 7.0) * 0.5;

  // stars
  vec2 g = p * 85.0;
  vec2 id = floor(g);
  vec2 fr = fract(g) - 0.5;
  float rnd = hash(id);
  float sd = length(fr - (vec2(hash(id + 3.1), hash(id + 7.7)) - 0.5) * 0.7);
  float st = step(0.955, rnd) * smoothstep(0.1, 0.0, sd) * (0.55 + 0.45 * sin(T * 1.4 + rnd * 40.0));
  col += C3 * st * h * (1.0 - band);

  // planet, half out of frame
  vec2 pc = vec2(-A * 0.5 + 0.1, 0.56) + M * 0.012;
  float pr = 0.4;
  float pd = length(p - pc);
  vec2 n = (p - pc) / pr;
  float lit = smoothstep(-0.25, 1.0, dot(n, normalize(vec2(0.65, -0.76))));
  float bands = fbm(vec2(n.x * 1.6 + T * 0.01, n.y * 7.0 + n.x * 1.5));
  vec3 pcol = mix(C0 * 0.3, mix(C1, C3, 0.35 + 0.4 * bands), lit * lit);
  pcol = mix(pcol, C2, smoothstep(0.55, 0.8, bands) * lit * 0.6);
  col = mix(col, pcol, smoothstep(pr + 0.003, pr - 0.003, pd));
  col += C3 * exp(-abs(pd - pr) * 38.0) * 0.28 * (0.3 + lit);

  // monolith
  float mx = A > 1.0 ? A * 0.27 : 0.0;
  float mh = A > 1.0 ? 0.6 : 0.5;
  vec2 b = p - vec2(mx, HOR);
  float mw = 0.055 * (1.0 - 0.14 * clamp(b.y / mh, 0.0, 1.0));
  float pulse = 0.8 + 0.2 * sin(T * 0.7);

  // light column rising from its crown
  float beam = exp(-abs(b.x) * 95.0) * smoothstep(mh - 0.02, mh + 0.02, b.y);
  col += C3 * beam * 0.55 * pulse;
  col += C2 * exp(-abs(b.x) * 16.0) * smoothstep(0.0, mh, b.y) * 0.1;

  float inside = step(abs(b.x), mw) * step(0.0, b.y) * step(b.y, mh);
  vec3 slab = C0 * 0.07;
  slab += C1 * 0.05 * step(0.93, fract(b.y * 26.0));
  vec2 wid = floor(vec2(b.x * 330.0, b.y * 230.0));
  slab += C2 * step(0.94, hash(wid)) * 0.6 * step(0.012, abs(b.x));
  slab += C2 * smoothstep(mw * 0.55, mw, abs(b.x)) * exp(-b.y * 5.0) * 0.5;
  slab += C3 * exp(-abs(b.x) * 260.0) * pulse;
  slab += C2 * exp(-abs(b.x) * 55.0) * 0.4 * pulse;
  col = mix(col, slab, inside);

  // traveller with a lantern
  vec2 fp = p - vec2(mx - 0.17, HOR);
  float bw = mix(0.0065, 0.0028, clamp(fp.y / 0.026, 0.0, 1.0));
  float fig = step(abs(fp.x), bw) * step(0.0, fp.y) * step(fp.y, 0.026);
  fig = max(fig, step(length(fp - vec2(0.0, 0.0305)), 0.0042));
  col = mix(col, C0 * 0.04, fig);
  float ld = length(fp - vec2(0.011, 0.017));
  col += C3 * (exp(-ld * 420.0) * 1.4 + exp(-ld * 60.0) * 0.18);

  return col;
}

void main() {
  vec2 p = (gl_FragCoord.xy - 0.5 * R) / R.y;
  vec3 col;
  if (p.y >= HOR) {
    col = scene(p);
  } else {
    // mirror plain
    float d = HOR - p.y;
    float rip = (noise(vec2(p.x * 38.0, d * 320.0 - T * 0.35)) - 0.5) * 0.014 * (0.25 + d * 7.0);
    col = scene(vec2(p.x + rip, HOR + d * 1.05));
    col *= clamp(0.72 - d * 1.5, 0.12, 1.0);
    col += C0 * 0.05;
  }
  col += C3 * exp(-abs(p.y - HOR) * 520.0) * 0.3;

  vec2 uv = gl_FragCoord.xy / R;
  col *= 1.0 - 0.38 * pow(length(uv - 0.5) * 1.25, 2.2);
  col += (hash(gl_FragCoord.xy + T) - 0.5) * 0.022;
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function () {
  var SKIES = [
    { name: 'Ember Tide',   c: ['#1b0f5c', '#ff3d2e', '#ff9f1c', '#fff1b8'] },
    { name: 'Cobalt Saint', c: ['#06123f', '#1f5bff', '#ffb000', '#ffffff'] },
    { name: 'Jade Reactor', c: ['#04303a', '#00c9a7', '#ffd23f', '#f4fff2'] },
    { name: 'Rose Nebula',  c: ['#2a0845', '#ff2e88', '#36c5ff', '#ffe3f3'] },
    { name: 'Orchid Dawn',  c: ['#123a5a', '#b28dff', '#ff8a5c', '#eaffd0'] }
  ];
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.documentElement;
  var nameEl = document.getElementById('skyName');
  var listEl = document.getElementById('skyList');

  function rgb(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
  }
  SKIES.forEach(function (s) { s.f = s.c.map(rgb); });

  var index = 0, picked = false;
  try {
    var saved = parseInt(localStorage.getItem('surgalxy-sky'), 10);
    if (saved >= 0 && saved < SKIES.length) { index = saved; picked = true; }
  } catch (e) {}

  var cur = SKIES[index].f.map(function (c) { return c.slice(); });
  var buttons = [];

  function setSky(i, byUser) {
    index = i;
    var s = SKIES[i];
    nameEl.textContent = s.name;
    root.style.setProperty('--deep', s.c[0]);
    root.style.setProperty('--hot', s.c[1]);
    root.style.setProperty('--flare', s.c[2]);
    root.style.setProperty('--light', s.c[3]);
    buttons.forEach(function (b, k) { b.setAttribute('aria-pressed', k === i ? 'true' : 'false'); });
    if (byUser) {
      picked = true;
      try { localStorage.setItem('surgalxy-sky', String(i)); } catch (e) {}
    }
  }

  SKIES.forEach(function (s, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch';
    b.id = 'sky-' + i;
    b.title = s.name;
    b.setAttribute('aria-label', s.name + ' sky');
    b.style.background = 'linear-gradient(135deg, ' + s.c[1] + ' 0 50%, ' + s.c[2] + ' 50% 100%)';
    b.addEventListener('click', function () { setSky(i, true); });
    listEl.appendChild(b);
    buttons.push(b);
  });
  setSky(index, false);

  // The sky drifts to the next palette on its own until someone picks one.
  if (!reduce) {
    setInterval(function () {
      if (!picked && !document.hidden) setSky((index + 1) % SKIES.length, false);
    }, 14000);
  }

  var copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', function () {
    var done = function (t) {
      copyBtn.textContent = t;
      setTimeout(function () { copyBtn.textContent = 'Copy email'; }, 1800);
    };
    try {
      navigator.clipboard.writeText('surgalxy@gmail.com').then(
        function () { done('Copied'); },
        function () { done('Select the address to copy'); }
      );
    } catch (e) { done('Select the address to copy'); }
  });

  // WebGL sky
  var canvas = document.getElementById('sky');
  var gl = null;
  try { gl = canvas.getContext('webgl', { antialias: false, alpha: false }); } catch (e) {}
  if (!gl) { canvas.style.display = 'none'; return; }

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.log(gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  var vs = compile(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }');
  var fs = compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent);
  var prog = gl.createProgram();
  if (!vs || !fs) { canvas.style.display = 'none'; return; }
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { canvas.style.display = 'none'; return; }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  var U = {};
  ['R', 'T', 'M', 'C0', 'C1', 'C2', 'C3'].forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
  }
  window.addEventListener('resize', resize);
  resize();

  var mt = [0, 0], m = [0, 0];
  window.addEventListener('pointermove', function (e) {
    mt[0] = (e.clientX / window.innerWidth) * 2 - 1;
    mt[1] = 1 - (e.clientY / window.innerHeight) * 2;
  });

  var start = performance.now();
  function frame(now) {
    resize();
    var tgt = SKIES[index].f;
    for (var i = 0; i < 4; i++) for (var k = 0; k < 3; k++) cur[i][k] += (tgt[i][k] - cur[i][k]) * 0.03;
    m[0] += (mt[0] - m[0]) * 0.04; m[1] += (mt[1] - m[1]) * 0.04;
    gl.uniform2f(U.R, canvas.width, canvas.height);
    gl.uniform1f(U.T, reduce ? 12.0 : (now - start) / 1000 + 12.0);
    gl.uniform2f(U.M, reduce ? 0 : m[0], reduce ? 0 : m[1]);
    gl.uniform3fv(U.C0, cur[0]); gl.uniform3fv(U.C1, cur[1]);
    gl.uniform3fv(U.C2, cur[2]); gl.uniform3fv(U.C3, cur[3]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
