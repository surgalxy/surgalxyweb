<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURGALXY</title>
<meta name="description" content="SURGALXY — Ethereal Tech. AI-generated visual worlds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #08080c;
    --surface: #0e0e14;
    --text-primary: #e8e6f0;
    --text-dim: #6b6880;
    --text-muted: #3d3a4d;
    --accent: #8b7cf6;
    --accent-dim: rgba(139, 124, 246, 0.08);
    --accent-glow: rgba(139, 124, 246, 0.15);
    --chromatic-1: #6ee7b7;
    --chromatic-2: #7dd3fc;
    --chromatic-3: #c4b5fd;
    --grain-opacity: 0.035;
  }

  html { font-size: 16px; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Instrument Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Grain overlay ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: var(--grain-opacity);
    pointer-events: none;
    z-index: 100;
  }

  /* ── Ambient glow orbs ── */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0;
    animation: orbFadeIn 3s ease forwards;
    pointer-events: none;
    will-change: transform;
  }

  .orb-1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    top: -15%; right: -10%;
    animation-delay: 0.5s;
    animation-duration: 3s;
  }
  .orb-2 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(110, 231, 183, 0.06) 0%, transparent 70%);
    bottom: -10%; left: -5%;
    animation-delay: 1s;
    animation-duration: 3.5s;
  }
  .orb-3 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(125, 211, 252, 0.04) 0%, transparent 70%);
    top: 40%; left: 50%;
    transform: translateX(-50%);
    animation-delay: 1.5s;
    animation-duration: 4s;
  }

  @keyframes orbFadeIn {
    to { opacity: 1; }
  }

  /* ── Slow drift for orbs ── */
  .orb-1 { animation: orbFadeIn 3s 0.5s ease forwards, drift1 25s 3s ease-in-out infinite; }
  .orb-2 { animation: orbFadeIn 3.5s 1s ease forwards, drift2 30s 4s ease-in-out infinite; }
  .orb-3 { animation: orbFadeIn 4s 1.5s ease forwards, drift3 20s 5s ease-in-out infinite; }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-30px, 20px); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(20px, -15px); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translateX(-50%) translate(0, 0); }
    50% { transform: translateX(-50%) translate(15px, 25px); }
  }

  /* ── Horizontal rule lines ── */
  .rule-top, .rule-bottom {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--text-muted), transparent);
    animation: ruleExpand 2s 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .rule-top { top: 15%; }
  .rule-bottom { bottom: 15%; }

  @keyframes ruleExpand {
    to { width: min(80vw, 700px); }
  }

  /* ── Main content ── */
  .container {
    text-align: center;
    position: relative;
    z-index: 10;
    padding: 2rem;
  }

  /* Wordmark */
  .wordmark {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(2.8rem, 8vw, 5.5rem);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-primary);
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 1.4s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    position: relative;
    line-height: 1;
    margin-right: -0.28em; /* compensate tracking */
  }

  /* Subtle chromatic shimmer on hover */
  .wordmark::after {
    content: 'SURGALXY';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--chromatic-1), var(--chromatic-2), var(--chromatic-3));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .wordmark:hover::after {
    opacity: 1;
  }

  .tagline {
    font-family: 'Instrument Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(0.7rem, 1.8vw, 0.85rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 1.4rem;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 1.4s 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    margin-right: -0.35em;
  }

  /* ── Social links ── */
  .socials {
    display: flex;
    gap: 1.8rem;
    justify-content: center;
    margin-top: 3rem;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp 1.4s 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .socials a {
    color: var(--text-muted);
    text-decoration: none;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.5rem 0;
    position: relative;
    transition: color 0.4s ease;
  }

  .socials a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 1px;
    background: var(--accent);
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .socials a:hover {
    color: var(--text-primary);
  }
  .socials a:hover::after {
    width: 100%;
  }

  /* ── Dot separator between links ── */
  .dot {
    color: var(--text-muted);
    font-size: 0.5rem;
    align-self: center;
    opacity: 0.4;
  }

  /* ── Bottom status ── */
  .status {
    position: fixed;
    bottom: 2.5rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 0.6rem;
    opacity: 0;
    animation: fadeUp 1.4s 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    z-index: 10;
  }

  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--chromatic-1);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  .status-text {
    font-family: 'Instrument Sans', sans-serif;
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ── Corner accents ── */
  .corner {
    position: fixed;
    width: 20px;
    height: 20px;
    opacity: 0;
    animation: fadeUp 1.4s 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    z-index: 10;
  }
  .corner svg { width: 100%; height: 100%; }
  .corner-tl { top: 2rem; left: 2rem; }
  .corner-tr { top: 2rem; right: 2rem; transform: rotate(90deg); }
  .corner-bl { bottom: 2rem; left: 2rem; transform: rotate(-90deg); }
  .corner-br { bottom: 2rem; right: 2rem; transform: rotate(180deg); }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    .socials { gap: 1.2rem; }
    .socials a { font-size: 0.65rem; letter-spacing: 0.15em; }
    .corner { display: none; }
    .rule-top { top: 10%; }
    .rule-bottom { bottom: 10%; }
  }

  /* ── Selection color ── */
  ::selection {
    background: var(--accent);
    color: var(--bg);
  }
</style>
</head>
<body>

  <!-- Ambient orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Decorative rules -->
  <div class="rule-top"></div>
  <div class="rule-bottom"></div>

  <!-- Corner accents -->
  <div class="corner corner-tl">
    <svg viewBox="0 0 20 20" fill="none"><path d="M0 20V0h20" stroke="#3d3a4d" stroke-width="0.5"/></svg>
  </div>
  <div class="corner corner-tr">
    <svg viewBox="0 0 20 20" fill="none"><path d="M0 20V0h20" stroke="#3d3a4d" stroke-width="0.5"/></svg>
  </div>
  <div class="corner corner-bl">
    <svg viewBox="0 0 20 20" fill="none"><path d="M0 20V0h20" stroke="#3d3a4d" stroke-width="0.5"/></svg>
  </div>
  <div class="corner corner-br">
    <svg viewBox="0 0 20 20" fill="none"><path d="M0 20V0h20" stroke="#3d3a4d" stroke-width="0.5"/></svg>
  </div>

  <!-- Main content -->
  <div class="container">
    <h1 class="wordmark">SURGALXY</h1>
    <p class="tagline">Ethereal Tech</p>

    <nav class="socials">
      <a href="https://instagram.com/surgalxy" target="_blank" rel="noopener">Instagram</a>
      <span class="dot">●</span>
      <a href="https://tiktok.com/@surgalxy" target="_blank" rel="noopener">TikTok</a>
      <span class="dot">●</span>
      <a href="https://youtube.com/@surgalxy" target="_blank" rel="noopener">YouTube</a>
      <span class="dot">●</span>
      <a href="https://x.com/surgalxy" target="_blank" rel="noopener">X</a>
    </nav>
  </div>

  <!-- Status indicator -->
  <div class="status">
    <div class="status-dot"></div>
    <span class="status-text">New worlds loading</span>
  </div>

</body>
</html>
